name: Sync lecture sessions

on:
  schedule:
    # UTC 01,03,05,07,09 = 台灣 09,11,13,15,17
    - cron: '0 1,3,5,7,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run sync:sessions

      - name: Commit synced sessions if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sessions/synced.js .sync-report.json || true
          if git diff --staged --quiet; then
            echo "No session changes"
          else
            git commit -m "chore: sync lecture sessions from lv-24"
            git push || echo "Push skipped (check repo permissions)"
          fi

      - run: npm run build:all

      - uses: actions/upload-artifact@v4
        with:
          name: lecture-paste-html
          path: 官網貼上版/**/貼上用-HTML區塊.html

      - name: Report changes
        if: always()
        run: |
          if [ -f .sync-report.json ]; then
            echo "## Sync report" >> $GITHUB_STEP_SUMMARY
            cat .sync-report.json >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "有場次變更時，請下載 artifact 並重新貼回官網 CMS。" >> $GITHUB_STEP_SUMMARY
